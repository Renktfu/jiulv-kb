name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装
        run: |
          python -m pip install -U pip
          pip install -e ".[parsers,dev]"
      - name: 测试
        run: pytest -q
      - name: 冒烟：初始化并跑一次收录与检索
        run: |
          mkdir -p /tmp/smoke-corpus
          printf '# 测试\n\n- **地区**：海南·三亚·瑞吉\n\n电动门设计反人类，服务尚可。\n' > /tmp/smoke-corpus/a.md
          jiulv init /tmp/smoke
          python - <<'PY'
          import yaml, pathlib
          p = pathlib.Path('/tmp/smoke/config.yaml')
          cfg = yaml.safe_load(p.read_text())
          cfg['sources'] = [{"name": "smoke", "group": "t", "path": "/tmp/smoke-corpus",
                             "include": ["**/*.md"], "exclude": []}]
          p.write_text(yaml.safe_dump(cfg, allow_unicode=True))
          PY
          jiulv --config /tmp/smoke/config.yaml ingest -q
          jiulv --config /tmp/smoke/config.yaml search "电动门" --limit 1
