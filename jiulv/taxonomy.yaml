# 人群与痛点词表（默认值，可自行修改）
#
# 说明：钩子库里的 M1/C1/F1、P1–P7 是这套内容体系的索引码。原始资料里没有集中
# 定义，这里的释义是按已有钩子条目反推的默认版本。改成你自己团队的叫法即可，
# 组稿时传入 code 或中文标签都能命中。

audience:
  M1:
    label: 带 0-3 岁婴幼儿
    aliases: [婴儿, 宝宝, 带娃, 小月龄]
  M2:
    label: 带 4-6 岁学龄前
    aliases: [亲子, 幼儿园, 带娃]
  M3:
    label: 带 7-12 岁学龄儿童
    aliases: [小学生, 亲子, 研学]
  C1:
    label: 情侣 / 新婚
    aliases: [情侣, 蜜月, 二人, 纪念日]
  C2:
    label: 夫妻无孩 / 度假
    aliases: [夫妻, 度假, 躺平, 双人]
  F1:
    label: 朋友 / 闺蜜团
    aliases: [朋友, 闺蜜, 结伴, 团建]

pain:
  P1:
    label: 选哪家 / 选择困难
    aliases: [选择困难, 不知道选哪家, 纠结, 怎么选]
  P2:
    label: 房型景观与页面不符
    aliases: [房型, 景观, 房号, 选房, 海景]
  P3:
    label: 带娃不方便
    aliases: [带娃, 亲子设施, 儿童, 早餐, 推车]
  P4:
    label: 怕花冤枉钱
    aliases: [性价比, 预算, 加价, 冤枉钱, 智商税]
  P5:
    label: 踩雷与维权风险
    aliases: [避雷, 卫生, 服务差, 维权, 投诉]
  P6:
    label: 交通与时间成本
    aliases: [路程, 接机, 打车, 太远, 折腾]
  P7:
    label: 人流与预约排队
    aliases: [排队, 预约, 人流, 网红, 打卡]

# 钩子类型 → 适用场景提示，组稿时会带进提示词
hook_types:
  决策瘫痪:
    when: 目的地选项太多、读者挑花眼时
    risk: 低
  反常识:
    when: 行业里所有人都在推荐同一个选项，你有更具体的替代方案
    risk: 高，最易爆也最易被反驳
  代价警示:
    when: 有真实踩坑或加价案例可举证
    risk: 中，必须有事实支撑
  身份代入:
    when: 人群特征极其明确（带几岁娃、几个人出行）
    risk: 低
  时间窗口:
    when: 有季节性、涨价的明确时间点
    risk: 中，过期即失效
  数字具体:
    when: 有可核对的数字（房号、面积、车程、价位段）
    risk: 低

# 组稿时必须遵守的底线，会原样写进提示词
guardrails:
  - 资料里没有的信息一律不写，宁可不写也不编
  - 不写具体价格数字，只用「千元档」「性价比高」这类相对描述
  - 不能全夸或全骂，好和坏都要具体到可核对的细节
  - 程度词不写满：用「觉得还不错」「看运气」「见仁见智」
  - 路程时间、房型名字必须与资料一致，写前核对
